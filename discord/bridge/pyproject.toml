[project]
name = "harness-discord"
version = "0.1.0"
description = "Talk to your Harness Maxxing sessions from Discord."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness-discord = "harness_discord.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness_discord"]

[tool.pytest.ini_options]
pythonpath = ["."]
